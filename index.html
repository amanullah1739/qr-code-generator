<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR code generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Code generator</h1>
            <span>Paste a url or enter text to create QR codes</span>
        </header>
        <div class="input-field">
            <input type="text" placeholder="Enter text or url" required>
        </div>
        <button>
            Generate QR code
        </button>
        <div class="QR-field active">
            <img src="" alt="">
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
